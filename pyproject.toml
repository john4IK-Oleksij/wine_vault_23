[project]
name = "wine-vault"
version = "0.1.0"
description = "Global artisan wine marketplace"
requires-python = ">=3.11"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=5.2.19",
    "gunicorn>=27.0.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "*/migrations/*",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "RUF"]
ignore = [
    "RUF001",  # Ambiguous Cyrillic character in string
    "RUF002",  # Ambiguous Cyrillic character in docstring
    "RUF003",  # Ambiguous Cyrillic character in comment
]
